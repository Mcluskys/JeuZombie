name: Deploy Pygbag Game

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le jeu
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer Pygbag
        run: python -m pip install pygbag

      - name: Construire le jeu
        run: python -m pygbag --archive main.py

      - name: Extraire le site Web
        run: |
          mkdir -p site
          tar -xzf build/web/*.tar.gz -C site || tar -xzf *.tar.gz -C site

      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v5

      - name: Envoyer le site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Publier
        id: deployment
        uses: actions/deploy-pages@v4
